plugins {
    id("base")
    id("org.openapi.generator")
}

group = "rs.russian.api"

def openApiPath = "$projectDir/../openapi.yaml"
def npmName = "@russian-rs/portal-api-axios"
def baseVersion = resolveApiVersion(openApiPath)
def gitHash = project.hasProperty('gitHash') ? project.gitHash : 'local'
def npmVersion = "${baseVersion}-${gitHash}"
def npmRepository = "https://npm.pkg.github.com"

openApiGenerate {
    generatorName = "typescript-axios"
    inputSpec = openApiPath
    outputDir = "${projectDir}/build"
    templateDir = "${projectDir}/templates"
    typeMappings = [
            "set": "Array"
    ]
    configOptions = [
            "npmName"      : npmName,
            "npmVersion"   : npmVersion,
            "npmRepository": npmRepository
    ]
}


build {
    dependsOn(tasks.named("openApiGenerate"))
}
