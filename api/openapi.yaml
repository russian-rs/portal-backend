openapi: 3.0.1
info:
  title: volunteer-portal-api
  version: 1.2.0
  contact:
    email: dev@russian.rs
    url: https://russian.rs

servers:
  - url: https://REDACTED_HOST/api
    description: Test Environment
  - url: https://portal.russian.rs/api
    description: Prod Environment

tags:
  - name: user
    'x-displayName': User

paths:
  /user/profile:
    get:
      operationId: getProfile
      tags:
        - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
  /user/info:
    get:
      operationId: getInfo
      tags:
        - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
  /user/logout:
    post:
      operationId: logout
      tags:
        - user
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: false
          description: Logout from all devices
          required: false
      responses:
        '200':
          description: Successfully logged out
components:
  schemas:
    ErrorResponse:
      type: object
      description: Common object for error responses
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Error description
          nullable: false
    ErrorCode:
      type: string
      enum:
        - AUTHENTICATION_FAILED
        - BAD_CREDENTIALS
        - CREDENTIALS_EXPIRED
    UserProfileDto:
      type: object
      description: User profile
      required:
        - id
        - username
        - email
        - fullName
      properties:
        id:
          type: string
          nullable: false
        username:
          type: string
          nullable: false
        email:
          type: string
          nullable: false
        fullName:
          type: string
          nullable: false
    UserInfoDto:
      type: object
      description: User additional info
      required:
        - userId
      properties:
        userId:
          type: string
          nullable: false
        city:
          type: string
        address:
          type: string
        birthDate:
          type: string
          format: date
        telegram:
          type: string
        phone:
          type: string
        program:
          type: string
