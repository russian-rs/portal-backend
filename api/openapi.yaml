openapi: 3.0.1
info:
  title: volunteer-portal-api
  version: 1.19.0
  contact:
    email: dev@russian.rs
    url: https://russian.rs

servers:
  - url: https://REDACTED_HOST/api
    description: Test Environment
  - url: https://portal.russian.rs/api
    description: Prod Environment

tags:
  - name: user
    'x-displayName': User

paths:
  /user/account:
    get:
      operationId: getCurrentAccount
      tags:
        - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createUser
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
  /user/account/{id}/program/{code}:
    patch:
      operationId: setProgram
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            nullable: false
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
  /user/account/{id}/deactivate:
    post:
      operationId: deactivateAccount
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            nullable: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
  /user/account/{id}/activate:
    post:
      operationId: activateAccount
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            nullable: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
  /user/account/{id}/contracts:
    post:
      operationId: updateContracts
      description: Обновить список договоров волонтера
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            nullable: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ContractDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
  /user/info/{login}:
    get:
      operationId: getInfo
      tags:
        - user
      parameters:
        - name: login
          in: path
          description: User login
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
        '500':
          $ref: '#/components/responses/ServerError'

    patch:
      operationId: updateInfo
      tags:
        - user
      parameters:
        - name: login
          in: path
          description: User login
          required: true
          schema:
            type: string
            minLength: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfoUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
        '500':
          $ref: '#/components/responses/ServerError'

  /user/search:
    post:
      operationId: searchUsers
      tags:
        - user
      parameters:
        - name: searchQuery
          in: query
          required: true
          schema:
            type: string
        - name: pageRequest
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageRequest'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSearchFilter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
  /user/logout:
    post:
      operationId: logout
      tags:
        - user
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: false
          description: Logout from all devices
          required: false
      responses:
        '200':
          description: Successfully logged out
        '500':
          $ref: '#/components/responses/ServerError'
  /user/avatar:
    post:
      operationId: setAvatar
      tags:
        - user
      parameters:
        - name: avatarId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
  /user/resolve:
    post:
      operationId: resolveUsers
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              default: [ ]
              items:
                type: string
                maxLength: 100
                minLength: 1
                nullable: false
                description: username
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                default: [ ]
                items:
                  $ref: '#/components/schemas/UserInfoDto'

  /files/upload:
    post:
      operationId: uploadFile
      tags:
        - files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  nullable: false
      responses:
        '200':
          description: Successfully uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfoDto'
  /files/{id}:
    get:
      operationId: getFileInfo
      tags:
        - files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            nullable: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfoDto'
        '400':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /report:
    post:
      operationId: createReport
      tags:
        - report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDto'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: updateReport
      tags:
        - report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDto'
  /report/{id}:
    get:
      operationId: getReport
      tags:
        - report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDto'
        '404':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteReport
      tags:
        - report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
        '404':
          $ref: '#/components/responses/ServerError'
  /report/{id}/note:
    post:
      operationId: addNote
      tags:
        - report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteDto'
  /report/{id}/status:
    post:
      operationId: changeStatus
      tags:
        - report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReportStatusRequest'
      responses:
        '200':
          description: Success
  /reports:
    post:
      operationId: getReports
      tags:
        - report
      parameters:
        - name: pageRequest
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportFilter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPageResponse'

  /application/create:
    post:
      operationId: createApplication
      tags:
        - application
      parameters:
        - name: captchaToken
          in: query
          required: true
          schema:
            type: string
            nullable: false
            description: Turnstile Captcha Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusDto'
  /application/{id}:
    get:
      operationId: getApplication
      tags:
        - application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDto'
  /application/update:
    put:
      operationId: updateApplication
      tags:
        - application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDto'
  /applications:
    post:
      operationId: getApplications
      tags:
        - application
      parameters:
        - name: pageRequest
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageRequest'
        - name: searchQuery
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          "*/*":
            schema:
              $ref: '#/components/schemas/ApplicationsFilter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPageResponse'
  /application/status/{id}:
    get:
      operationId: getApplicationStatus
      tags:
        - application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            nullable: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusDto'
  /application/searchByEmail:
    get:
      operationId: searchApplicationByEmail
      tags:
        - application
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            nullable: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusDto'

  /mail/send:
    post:
      operationId: sendMail
      tags:
        - mail
      parameters:
        - name: subject
          in: query
          required: true
          schema:
            type: string
            minLength: 3
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: username
          in: query
          required: false
          schema:
            type: string
        - name: attachments
          in: query
          style: form
          required: false
          schema:
            type: array
            items:
              type: string
              nullable: false
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Success

  /note/{id}:
    delete:
      operationId: deleteNote
      tags:
        - note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success

  /programs:
    get:
      operationId: getPrograms
      tags:
        - programs
      summary: Получить список всех доступных программ
      responses:
        '200':
          description: Список программ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramDto'
        '500':
          $ref: '#/components/responses/ServerError'


  /projects:
    get:
      operationId: getProjects
      tags:
        - projects
      summary: Получить список всех доступных проектов
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectDto'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  responses:
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PageRequest:
      type: object
      description: Paging object
      properties:
        pageNumber:
          type: integer
          format: int32
          default: 0
          nullable: false
        pageSize:
          type: integer
          format: int32
          default: 10
          nullable: false
        sort:
          type: array
          default: [ ]
          items:
            type: string
    PageResponse:
      type: object
      nullable: false
      description: Page info
      required:
        - page
        - size
        - totalPages
        - totalElements
      properties:
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      description: Common object for error responses
      required:
        - message
      properties:
        message:
          type: string
          description: Error description
          nullable: false
    UserCreateRequest:
      type: object
      required:
        - email
        - username
        - fullName
        - contract
      properties:
        email:
          type: string
        username:
          type: string
        fullName:
          type: string
        contract:
          $ref: '#/components/schemas/ContractDto'
    UserInfoDto:
      type: object
      description: User additional info
      required:
        - id
        - username
        - email
        - fullName
        - groups
        - active
      properties:
        id:
          type: integer
          nullable: false
        username:
          type: string
          nullable: false
        email:
          type: string
          nullable: false
        fullName:
          type: string
          nullable: false
        city:
          type: string
        address:
          type: string
        birthDate:
          type: string
          format: date
        telegram:
          type: string
        phone:
          type: string
        program:
          $ref: '#/components/schemas/ProgramDto'
        project:
          $ref: '#/components/schemas/ProjectDto'
        avatar:
          $ref: '#/components/schemas/FileInfoDto'
        groups:
          type: array
          uniqueItems: true
          items:
            type: string
        active:
          type: boolean
          nullable: false
        contracts:
          type: array
          default: [ ]
          items:
            $ref: '#/components/schemas/ContractDto'
    UserInfoUpdateRequest:
      type: object
      description: update user info
      properties:
        city:
          type: string
        address:
          type: string
        birthDate:
          type: string
          format: date
        telegram:
          type: string
        phone:
          type: string
      additionalProperties: false
    UserPageResponse:
      type: object
      nullable: false
      required:
        - page
        - content
      properties:
        page:
          $ref: '#/components/schemas/PageResponse'
        content:
          type: array
          default: [ ]
          nullable: false
          items:
            $ref: '#/components/schemas/UserInfoDto'
    FileInfoDto:
      type: object
      nullable: true
      required:
        - id
        - name
        - link
        - size
      properties:
        id:
          type: string
          nullable: false
        name:
          type: string
          nullable: false
        link:
          type: string
          nullable: false
        contentLength:
          type: integer
          format: int64
          nullable: false
          description: Size (bytes)
    ReportFilter:
      type: object
      properties:
        login:
          type: string
          nullable: true
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true
        status:
          type: string
          nullable: true
        program:
          type: string
          nullable: true
    ReportDto:
      type: object
      nullable: false
      description: Report information
      required:
        - id
        - tasks
      properties:
        id:
          type: string
          format: uuid
        createTime:
          type: string
          format: date-time
        user:
          type: string
        status:
          type: string
        week:
          type: number
        tasks:
          type: array
          default: [ ]
          items:
            $ref: '#/components/schemas/TaskDto'
        notes:
          type: array
          default: [ ]
          items:
            $ref: '#/components/schemas/NoteDto'
    TaskDto:
      type: object
      description: Task information
      required:
        - id
        - date
        - name
        - description
        - timeSpent
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: When task was completed
        name:
          type: string
        description:
          type: string
        customer:
          type: string
          description: Login of customer
          nullable: true
        timeSpent:
          type: integer
          description: Time spent in minutes
        result:
          type: string
          nullable: true
        files:
          type: array
          default: [ ]
          items:
            $ref: '#/components/schemas/FileInfoDto'
    ReportPageResponse:
      type: object
      nullable: false
      required:
        - page
        - content
      properties:
        page:
          $ref: '#/components/schemas/PageResponse'
        content:
          type: array
          default: [ ]
          nullable: false
          items:
            $ref: '#/components/schemas/ReportDto'
    ContractDto:
      type: object
      required:
        - id
        - startDate
        - endDate
        - type
      properties:
        id:
          type: string
          format: uuid
          nullable: false
        startDate:
          type: string
          format: date
          nullable: false
        endDate:
          type: string
          format: date
          nullable: false
        type:
          $ref: '#/components/schemas/ContractTypeEnum'
    ApplicationDto:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        type:
          type: string
        created:
          type: string
          format: date-time
        email:
          type: string
        name:
          type: string
        patronymic:
          type: string
        birthDate:
          type: string
          format: date
        passport:
          type: string
        citizenship:
          type: string
        telegram:
          type: string
        inSerbia:
          type: boolean
        enterDate:
          type: string
          format: date
        address:
          type: string
        phone:
          type: string
        residenceRequired:
          type: boolean
        occupation:
          type: string
        hasExperience:
          type: boolean
        experience:
          type: string
        languages:
          type: string
        skills:
          type: string
        goal:
          type: string
        bio:
          type: string
        refuseReason:
          type: string
        comment:
          type: string
        contract:
          $ref: '#/components/schemas/ContractDto'
    ApplicationsFilter:
      type: object
      required:
        - showCompleted
      properties:
        showCompleted:
          type: boolean
          default: false
          description: Показывать обработанные заявки
    ApplicationStatusDto:
      type: object
      required:
        - id
        - status
        - progress
        - terminated
        - lastUpdate
      properties:
        id:
          type: string
          format: uuid
          nullable: false
        status:
          type: string
          nullable: false
        progress:
          type: integer
        terminated:
          type: boolean
        refuseReason:
          type: string
        lastUpdate:
          type: string
          format: date
          nullable: false
    ApplicationPageResponse:
      type: object
      nullable: false
      required:
        - page
        - content
      properties:
        page:
          $ref: '#/components/schemas/PageResponse'
        content:
          type: array
          default: [ ]
          nullable: false
          items:
            $ref: '#/components/schemas/ApplicationDto'
    NoteDto:
      type: object
      nullable: false
      required:
        - id
        - text
      properties:
        id:
          type: string
          format: uuid
        createTime:
          type: string
          format: date-time
        createdBy:
          type: string
        text:
          type: string
    ChangeReportStatusRequest:
      type: object
      nullable: false
      required:
        - status
      properties:
        status:
          type: string
          nullable: false
        note:
          type: string
    UserSearchFilter:
      type: object
      nullable: false
      required:
        - onlyInactive
      properties:
        onlyInactive:
          type: boolean
          nullable: false
          default: false
          description: Показывать только неактивных пользователей
        programCodes:
          type: array
          description: Показывать только пользователей указанных программ
          items:
            type: string
          uniqueItems: true
          minItems: 1
    ContractTypeEnum:
      type: string
      enum:
        - ASSOCIATED
        - REGULAR
    ProgramDto:
      type: object
      required:
        - code
        - nameRu
        - nameEn
        - nameSr
      properties:
        code:
          type: string
        nameRu:
          type: string
        nameEn:
          type: string
        nameSr:
          type: string
    ProjectDto:
      type: object
      required:
        - code
        - nameRu
        - nameEn
        - nameSr
      properties:
        code:
          type: string
        nameRu:
          type: string
        nameEn:
          type: string
        nameSr:
          type: string