openapi: 3.0.1
info:
  title: volunteer-portal-api
  version: 1.2.0
  contact:
    email: dev@russian.rs
    url: https://russian.rs

servers:
  - url: https://portal-test.russian.rs/api
    description: Test Environment
  - url: https://portal.russian.rs/api
    description: Prod Environment

tags:
  - name: user
    'x-displayName': User

paths:
  /user/account:
    get:
      operationId: getCurrentAccount
      tags:
        - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/info/{login}:
    get:
      operationId: getInfo
      tags:
        - user
      parameters:
        - name: login
          in: path
          description: User login
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/logout:
    post:
      operationId: logout
      tags:
        - user
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: false
          description: Logout from all devices
          required: false
      responses:
        '200':
          description: Successfully logged out
        '500':
          $ref: '#/components/responses/ServerError'
components:
  responses:
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: Common object for error responses
      required:
        - message
      properties:
        message:
          type: string
          description: Error description
          nullable: false
    AccountDto:
      type: object
      description: User profile
      required:
        - id
        - username
        - email
        - fullName
      properties:
        id:
          type: string
          nullable: false
        username:
          type: string
          nullable: false
        email:
          type: string
          nullable: false
        fullName:
          type: string
          nullable: false
    UserInfoDto:
      type: object
      description: User additional info
      required:
        - userId
      properties:
        userId:
          type: string
          nullable: false
        username:
          type: string
          nullable: false
        email:
          type: string
          nullable: false
        fullName:
          type: string
          nullable: false
        city:
          type: string
        address:
          type: string
        birthDate:
          type: string
          format: date
        telegram:
          type: string
        phone:
          type: string
        program:
          type: string
