databaseChangeLog:
  - changeSet:
      id: 1.8.0-create-project-statistic-group-table
      author: Valerii Linden
      changes:
        - createTable:
            tableName: project_statistic_group
            columns:
              - column:
                  name: project_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: group_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: project_statistic_group
            baseColumnNames: project_code
            referencedTableName: project
            referencedColumnNames: code
            constraintName: fk_project_statistic_group_to_project

        - insert:
            tableName: project_statistic_group
            columns:
              - column: { name: project_code, value: LAWS }
              - column: { name: group_name, value: SOCIJALNA_ZASTITA }

