databaseChangeLog:
  - changeSet:
      id: 1.0.0-account-create-table
      author: Maksim Aminov
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_account
                  name: id
                  type: INT
              - column:
                  constraints:
                    nullable: false
                  name: version
                  type: DATETIME
              - column:
                  constraints:
                    nullable: false
                    unique: true
                  name: username
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                    unique: true
                  name: email
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: full_name
                  type: VARCHAR(255)
              - column:
                  name: groups
                  type: jsonb
                  defaultValue: '[]'
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValue: 'true'
                  constraints:
                    nullable: false
              - column:
                  name: last_synced
                  type: timestamp
