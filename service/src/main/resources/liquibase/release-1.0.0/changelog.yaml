databaseChangeLog:
  - changeSet:
      id: create-table-user-1724505981522-1
      author: Maksim Aminov
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_user
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: version
                  type: DATETIME
              - column:
                  constraints:
                    nullable: false
                  name: username
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: email
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: password
                  type: VARCHAR(255)
            tableName: users
        - createSequence:
            dataType: BIGINT
            incrementBy: 50
            sequenceName: users_seq
            startValue: 1000
  - changeSet:
      id: create-table-user-token-1724505981522-2
      author: Maksim Aminov
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_user_token
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: version
                  type: DATETIME
              - column:
                  constraints:
                    nullable: false
                  name: token
                  type: TEXT
              - column:
                  constraints:
                    nullable: false
                  name: user_id
                  type: BIGINT
            tableName: user_token
        - createSequence:
            dataType: BIGINT
            incrementBy: 50
            sequenceName: user_token_seq
            startValue: 1000
  - changeSet:
      id: create-constrains-user-token-1724505981522-3
      author: Maksim Aminov
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: user_token
            constraintName: FK_USER_TOKEN_ON_USER
            referencedColumnNames: id
            referencedTableName: users
        - addUniqueConstraint:
            columnNames: token
            constraintName: UQ_USER_TOKEN
            tableName: user_token
