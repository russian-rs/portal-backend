databaseChangeLog:
  - changeSet:
      id: 1.12.0-create-program-project-map
      author: Valerii Linden
      changes:
        - createTable:
            tableName: program_project
            columns:
              - column:
                  name: program_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: project_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: program_project
            columnNames: program_code, project_code
            constraintName: pk_program_project
        - addForeignKeyConstraint:
            baseTableName: program_project
            baseColumnNames: program_code
            referencedTableName: program
            referencedColumnNames: code
            onDelete: CASCADE
            constraintName: fk_pp_program
        - addForeignKeyConstraint:
            baseTableName: program_project
            baseColumnNames: project_code
            referencedTableName: project
            referencedColumnNames: code
            onDelete: CASCADE
            constraintName: fk_pp_project
        - createIndex:
            tableName: program_project
            indexName: idx_pp_program
            columns:
              - column:
                  name: program_code
        - createIndex:
            tableName: program_project
            indexName: idx_pp_project
            columns:
              - column:
                  name: project_code