databaseChangeLog:
  - changeSet:
      id: 1.3.0-email-outbox-create-table
      author: Maksim Aminov
      changes:
        - createTable:
            tableName: email_outbox
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_email_outbox
                  name: id
                  type: UUID
              - column:
                  constraints:
                    nullable: false
                  name: version
                  type: DATETIME
              - column:
                  constraints:
                    nullable: false
                  name: status
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: properties
                  type: JSONB
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  constraints:
                    nullable: false
                  name: retries
                  type: INTEGER
                  defaultValue: 0
              - column:
                  constraints:
                    nullable: false
                  name: create_time
                  type: DATETIME
              - column:
                  name: send_time
                  type: DATETIME
