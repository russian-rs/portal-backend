databaseChangeLog:
  - changeSet:
      id: 1.6.0-create-program-table
      author: Valerii Linden
      changes:
        - createTable:
            tableName: program
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_program
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: program
            columnNames: code
            constraintName: uq_program_code
        - insert:
            tableName: program
            columns:
              - column: { name: code, value: IT }
        - insert:
            tableName: program
            columns:
              - column: { name: code, value: MEDIA }
        - insert:
            tableName: program
            columns:
              - column: { name: code, value: DESIGN }
        - insert:
            tableName: program
            columns:
              - column: { name: code, value: URBANISM }
        - insert:
            tableName: program
            columns:
              - column: { name: code, value: INFORMATION }
        - insert:
            tableName: program
            columns:
              - column: { name: code, value: EDUCATION }
        - insert:
            tableName: program
            columns:
              - column: { name: code, value: LAW }