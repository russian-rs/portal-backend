--- # Common
spring:
  application:
    name: portal
  main:
    banner-mode: off
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8081
  error:
    whitelabel.enabled: false
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 48h

app:
  frontend-uri: ${FRONTEND_URL}
  s3:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION}
    endpoint: ${S3_ENDPOINT}
    bucket: ${S3_BUCKET}
    bucket-service: ${S3_BUCKET_SERVICE}
    presign-duration: PT12H
  authentik:
    base-url: ${OAUTH2_SERVER}
    api-key: ${AUTHENTIK_API_KEY}
  wordpress:
    base-url: ${WP_BASE_URL}
    username: ${WP_USERNAME}
    password: ${WP_PASSWORD}
  schedulers:
    email-outbox: "*/15 * * * * *"
    user-sync: "0 0 */1 * * *"

--- # Data
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?ApplicationName=${spring.application.name}&targetServerType=master
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      schema: public
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    default-schema: ${spring.datasource.hikari.schema}
    change-log: classpath:/liquibase/changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASS}
      database: ${REDIS_DATABASE}

--- # Security
spring:
  security:
    oauth2:
      client:
        provider:
          authentik:
            issuer-uri: ${OAUTH2_SERVER}/application/o/${spring.application.name}/
            authorization-uri: ${OAUTH2_SERVER}/application/o/authorize/
            token-uri: ${OAUTH2_SERVER}/application/o/token/
            user-info-uri: ${OAUTH2_SERVER}/application/o/userinfo/
            jwk-set-uri: ${OAUTH2_SERVER}/application/o/${spring.application.name}/jwks/
            user-name-attribute: nickname
        registration:
          authentik:
            client-id: ${OAUTH2_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_SECRET}
            client-name: Authentik SSO
            provider: authentik
            redirect-uri: ${FRONTEND_URL}/api/oauth2/code
            authorization-grant-type: authorization_code
            scope: openid, email, profile

# Cloudflare Turnstile Captcha
ds:
  cf:
    turnstile:
      sitekey: ${TURNSTILE_SITE_KEY}
      secret: ${TURNSTILE_SECRET}

--- # Mail
spring:
  mail:
    host: ${SMTP_SERVER}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true
    default-encoding: UTF-8
management:
  health:
    mail:
      enabled: false

--- # Errors
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
