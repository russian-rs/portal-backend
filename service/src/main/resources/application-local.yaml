--- # Common
server:
  error:
    include-message: always

app:
  frontend-uri: ${FRONTEND_URL:http://localhost:3000}
  s3:
    region: ${S3_REGION:eu-central}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:portal-files}
    bucket-service: ${S3_BUCKET_SERVICE:portal-data}
  authentik:
    base-url: https://REDACTED_HOST
    # Можно взять в Coolify в настройках окружения
    api-key: ${AUTHENTIK_API_KEY:no-key}
  wordpress:
    instances:
  helpdesk:
    api-key: ${HELPDESK_API_KEY:no-key}
    api-base-url: ${HELPDESK_API_BASE_URL:http://localhost/api/v1}
    ticket-base-url: ${HELPDESK_TICKET_BASE_URL:http://localhost/ticket/zoom}
  schedulers:
    email-outbox: "-"
    user-sync: "-"
    contract-expiration: "-"

ds:
  cf:
    turnstile:
      url: http://localhost:${server.port}/turnstile

--- # Data
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME:portal}?ApplicationName=${spring.application.name}&targetServerType=master
    username: ${DB_USER:admin}
    password: ${DB_PASS:123456}
  jpa:
    #    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:123456}
      database: ${REDIS_DATABASE:0}

--- # Security
spring:
  security:
    oauth2:
      client:
        provider:
          authentik:
            issuer-uri: https://REDACTED_HOST/application/o/${spring.application.name}/
            authorization-uri: https://REDACTED_HOST/application/o/authorize/
            token-uri: https://REDACTED_HOST/application/o/token/
            user-info-uri: https://REDACTED_HOST/application/o/userinfo/
            jwk-set-uri: https://REDACTED_HOST/application/o/${spring.application.name}/jwks/
        registration:
          authentik:
            # Можно взять в Coolify в настройках окружения
            client-id: ${OAUTH2_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_SECRET}
            redirect-uri: http://localhost:3000/api/oauth2/code

--- # Mail
spring:
  mail:
    host: ${SMTP_SERVER:localhost}
    username: ${SMTP_USERNAME:change}
    password: ${SMTP_PASSWORD:change}

--- # Logging
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    okhttp3.logging.HttpLoggingInterceptor: DEBUG
  config: classpath:logback-local.xml
