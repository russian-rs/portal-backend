--- # Common
server:
  error:
    include-message: always

app:
  frontend-uri: http://localhost:3000

--- # Data
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/volunteer_portal?ApplicationName=${spring.application.name}&targetServerType=master
    username: admin
    password: 123456
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

--- # Logging
logging:
  level:
    org.hibernate: TRACE
