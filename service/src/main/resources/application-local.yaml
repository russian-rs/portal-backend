--- # Common
server:
  error:
    include-message: always

--- # Data
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/volunteer_portal?ApplicationName=${spring.application.name}&targetServerType=master
    username: admin
    password: 123456
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

--- # Security
spring:
  security:
    oauth2:
      client:
        registration:
          authentik:
            redirect-uri: http://localhost:3000/api/oauth2/code

--- # Logging
logging:
  level:
    org.hibernate: TRACE
