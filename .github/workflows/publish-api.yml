name: Publish API

on:
  push:
    paths:
      - api/**
      - .github/**

jobs:
  Publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Generate API
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)
          ./gradlew clean axios-client:build -x test -PgitHash=${SHORT_SHA}
      - name: Publish NPM package
        working-directory: ./api/axios-client/build
        run: |
          echo //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }} > .npmrc
          npm install
          npm publish
